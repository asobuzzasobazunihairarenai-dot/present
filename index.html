<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>読み込み中…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#8fd8d2; --panel:#fff; --ink:#0d2b2c; --ink-soft:#2c4c4d; --muted:#4f6f70;
    --rule:#d8ecea; --accent:#0a7d80; --accent-deep:#05585c;
    --on-paper:#0a2a2b; --on-paper-soft:#1f4749;   /* 青地の上に直接置く文字 */
    --win:#b8860b; --warn:#a8560c; --warn-pale:#fdf3e6;
    --c1:#c70025; --c2:#ee781f; --c3:#fabe00; --c4:#22ac38; --c5:#1bb8ce; --c6:#f19ec2; --c7:#915da3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink); min-height:100vh;
    font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
    line-height:1.85; padding:0 1.1rem 4rem;
  }
  .spectrum{display:flex;gap:2px;height:6px;margin:0 -1.1rem 0}
  .spectrum i{flex:1}
  .wrap{max-width:34rem;margin:0 auto;padding-top:2.6rem}
  .mincho{font-family:"Zen Old Mincho",serif}

  /* ロゴは背景を抜いた版（removebg）を使い、青地に直接置く。
     白地を焼き込んだ版を使うと、透過していないので白い四角が出る */
  .logobox{margin-bottom:1.6rem;text-align:center}
  .logobox img{display:block;width:100%;max-width:17rem;height:auto;margin:0 auto}
  .kv{display:block;width:100%;height:auto;border-radius:8px;margin-bottom:.9rem}
  .eyebrow{font-size:.72rem;letter-spacing:.24em;color:var(--accent-deep);font-weight:700;margin-bottom:.9rem}
  h1{font-size:1.9rem;line-height:1.35;font-weight:900;letter-spacing:.01em;text-wrap:balance}
  .lead{color:var(--on-paper-soft);margin-top:1rem;font-size:.97rem}
  .eyebrow{color:var(--accent-deep)}
  h1{color:var(--on-paper)}

  .card{
    background:var(--panel);border:1px solid var(--rule);border-radius:10px;
    padding:1.4rem 1.3rem;margin-top:1.6rem;
  }
  .card h2{font-size:1.02rem;font-weight:700;margin-bottom:.6rem}
  .prize{font-family:"Zen Old Mincho",serif;font-size:1.25rem;font-weight:600;line-height:1.5}
  .note{font-size:.86rem;color:var(--muted);margin-top:.5rem}

  ol.cond{list-style:none;counter-reset:c;display:flex;flex-direction:column;gap:.8rem;margin-top:.4rem}
  ol.cond li{counter-increment:c;display:grid;grid-template-columns:1.5rem 1fr;gap:.7rem;align-items:start;font-size:.94rem}
  ol.cond li::before{
    content:counter(c);width:1.5rem;height:1.5rem;border-radius:50%;
    background:var(--accent);color:#fff;font-size:.78rem;font-weight:700;
    display:flex;align-items:center;justify-content:center;margin-top:.18rem;
  }

  /* 番号は7色から取る。白文字が乗るので黄は使わない */
  ol.cond li:nth-child(1)::before{background:var(--c1)}
  ol.cond li:nth-child(2)::before{background:var(--c4)}
  ol.cond li:nth-child(3)::before{background:var(--c7)}
  .agree{display:flex;gap:.7rem;align-items:flex-start;margin-top:1.4rem;font-size:.9rem;color:var(--on-paper-soft)}
  .agree input{width:1.15rem;height:1.15rem;margin-top:.25rem;flex:none;accent-color:var(--accent)}
  .agree a{color:var(--accent-deep)}

  button.go{
    display:block;width:100%;margin-top:1.3rem;padding:1.05rem 1rem;
    background:var(--accent);color:#fff;border:none;border-radius:8px;
    font-size:1.05rem;font-weight:700;font-family:inherit;cursor:pointer;
    letter-spacing:.04em;
  }
  button.go:disabled{background:#c8c4bc;cursor:not-allowed}
  button.go:focus-visible{outline:3px solid var(--accent-deep);outline-offset:2px}

  .result{text-align:center;padding:2.2rem 1.3rem}
  .result .big{font-family:"Zen Old Mincho",serif;font-size:2.1rem;font-weight:900;line-height:1.35}
  .result .big.win{color:var(--win)}
  .result{background:#fff;border-radius:10px;margin-top:1.6rem}
  .result .sub{color:var(--ink-soft);margin-top:.9rem;font-size:.97rem}
  .prizebox{
    margin-top:1.4rem;background:#fffdf5;border:1px solid #e8dcae;border-radius:8px;padding:1.1rem;
    text-align:left;
  }
  .prizebox b{display:block;font-size:.85rem;color:var(--warn);margin-bottom:.5rem}
  .prizebox a{font-size:.92rem;word-break:break-all;color:var(--accent-deep)}

  .msg{background:var(--warn-pale);border:1px solid #f0dcc0;border-radius:8px;
       padding:.9rem 1rem;margin-top:1.4rem;font-size:.9rem;color:#6b4410}

  details{margin-top:1.6rem;border-top:1px solid var(--rule);padding-top:1rem}
  summary{cursor:pointer;font-size:.9rem;font-weight:700;color:var(--ink-soft)}
  details pre{
    white-space:pre-wrap;font-family:inherit;font-size:.83rem;color:var(--muted);
    margin-top:.9rem;line-height:1.85;
  }
  .offer{margin-top:1.4rem;padding:1rem 1.1rem;border:1px solid var(--accent);
    border-radius:.6rem;background:#fff;font-size:.86rem;line-height:1.8}
  .offer b{display:block;margin-bottom:.4rem;color:var(--accent-deep);font-size:.94rem}
  .offer p{margin:.25rem 0}
  .offer .fine{font-size:.78rem;color:var(--muted)}
  .about{margin-top:1.8rem;padding:.9rem 1rem;background:rgba(255,255,255,.72);border:1px solid var(--rule);border-radius:.6rem;font-size:.8rem;color:var(--muted);line-height:1.7}
  .about b{display:block;margin-bottom:.35rem;color:var(--ink);font-weight:600}
  .about p{margin:.2rem 0}
  .footer-sub{margin-top:.4rem;font-size:.7rem}
  footer{margin-top:2.6rem;text-align:center;font-size:.74rem;color:var(--on-paper-soft);letter-spacing:.04em}
  footer a{color:var(--on-paper-soft)}
  .hidden{display:none!important}
  /* 管理画面で作ったキャンペーン：7色の飾りをやめ、テーマ色1色に揃える */
  body.themed ol.cond li::before{background:var(--accent)!important}
  .offer .body{white-space:pre-wrap}
  .spin{
    width:1.4rem;height:1.4rem;border:2px solid var(--rule);border-top-color:var(--accent);
    border-radius:50%;margin:2.5rem auto;animation:sp .8s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ .spin{animation:none} }
</style>
</head>
<body>

<div class="spectrum">
  <i style="background:var(--c1)"></i><i style="background:var(--c2)"></i><i style="background:var(--c3)"></i>
  <i style="background:var(--c4)"></i><i style="background:var(--c5)"></i><i style="background:var(--c6)"></i>
  <i style="background:var(--c7)"></i>
</div>

<div class="wrap">
  <div id="loading"><div class="spin"></div></div>
  <div id="app" class="hidden"></div>

  <footer>
    <a href="https://www.asobuzz.net/">Asobuzz LLC</a>
    <div class="footer-sub">抽選システム制作：Asobuzz LLC ／ ご相談は <a href="https://x.com/7shadesofseven" target="_blank" rel="noopener">@7shadesofseven</a></div>
  </footer>
</div>

<script>
const FN = "https://prnddzrnblfysggiuzmo.supabase.co/functions/v1/present";
const SLUG = new URLSearchParams(location.search).get("c") || "nanairo";
const qs = new URLSearchParams(location.search);
const app = document.getElementById("app");
const loading = document.getElementById("loading");

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const ERRORS = {
  agree: "お名前の公開に同意いただく必要があります。",
  closed: "このキャンペーンは現在受け付けていません。",
  nowin: "このXアカウントでの当選の記録が見つかりませんでした。当選したアカウントでログインしているかご確認ください。",
  notfound: "キャンペーンが見つかりませんでした。",
  cancel: "Xでの連携がキャンセルされました。",
  expired: "時間が経ちすぎたため、やり直してください。",
  xauth: "Xとの連携がうまくいきませんでした。少し待ってからもう一度お試しください。",
  server: "うまくいきませんでした。少し待ってからもう一度お試しください。",
};

// ------------------------------------------------ 見た目（キャンペーンごと）
// 管理画面で作ったキャンペーンには theme.claimUntil が必ず入る。無いものは七日七色（最初のキャンペーン）の見た目のまま
let THEME = { legacy: true, th: {} };
function applyTheme(c) {
  const th = (c && c.theme) || {};
  const legacy = !th.claimUntil;
  THEME = { legacy, th };
  if (legacy) return THEME;
  const a = /^#[0-9a-fA-F]{6}$/.test(th.accent || "") ? th.accent : "#0a7d80";
  const st = document.documentElement.style;
  st.setProperty("--accent", a);
  st.setProperty("--accent-deep", "color-mix(in srgb, " + a + " 72%, #000)");
  st.setProperty("--paper", "color-mix(in srgb, " + a + " 20%, #fff)");
  st.setProperty("--rule", "color-mix(in srgb, " + a + " 16%, #fff)");
  document.body.classList.add("themed");
  const sp = document.querySelector(".spectrum");
  if (sp) sp.innerHTML = '<i style="background:var(--accent)"></i>';
  return THEME;
}
const WD = ["日", "月", "火", "水", "木", "金", "土"];
function ymdw(day) {   // "2026-09-30" → "2026年9月30日（水）"
  const d = new Date(Date.parse(day + "T12:00:00+09:00"));
  return day.slice(0, 4) + "年" + Number(day.slice(5, 7)) + "月" + Number(day.slice(8, 10)) + "日（" + WD[d.getUTCDay()] + "）";
}

function show(html, title) {
  app.innerHTML = html;
  loading.classList.add("hidden");
  app.classList.remove("hidden");
  if (title) document.title = title;
}

// ------------------------------------------------ 結果画面
async function showResult(id, already) {
  let r = null;
  try {
    const res = await fetch(FN + "/result?id=" + encodeURIComponent(id));
    r = await res.json();
  } catch (e) { /* 下で扱う */ }
  if (!r || !r.ok) return show(`<div class="msg">結果を読み込めませんでした。時間をおいてお試しください。</div>` + againLink(), "結果");
  try { applyTheme(await (await fetch(FN + "/campaign?c=" + encodeURIComponent(SLUG))).json()); } catch (e) { /* 見た目だけの話なので続ける */ }
  const perk = THEME.legacy ? "すでにご購入済みの方には、未発表の緑EDITION（テストプレイ中）をお渡しします。@7shadesofseven までDMでお知らせください。" : "";

  if (already || r.result === "already_today") {
    return show(`<div class="result">
      <div class="big mincho">本日はもう応募済みです</div>
      <p class="sub">応募は1日1回までです。<br>また明日、挑戦してください。</p>
    </div>` + againLink(), "本日は応募済み");
  }
  if (r.result === "won") {
    return show(`<div class="result">
      <div class="big mincho win">当選しました</div>
      <p class="sub">おめでとうございます、@${esc(r.name)} さん。<br>下のリンクから受け取ってください。</p>
      ${r.prize ? `<div class="prizebox">
        <b>受け取りリンク（このページを閉じる前に開いてください）</b>
        <a href="${esc(r.prize)}" target="_blank" rel="noopener">${esc(r.prize)}</a>
      </div>
      <p class="sub" style="font-size:.86rem">画面を閉じてしまった場合も、応募ページから当選したXアカウントでログインすると、もう一度表示できます。</p>` : ""}
    ${perk ? `<p class="sub" style="font-size:.84rem">${perk}</p>` : ""}
    </div>`, "当選しました");
  }
  if (r.result === "not_qualified") {
    const why = r.reason === "follow" ? "フォローが確認できませんでした。"
      : r.reason === "repost" ? "リポストが確認できませんでした。"
      : "条件の確認ができませんでした。";
    return show(`<div class="result">
      <div class="big mincho">条件が確認できませんでした</div>
      <p class="sub">${why}<br>フォローとリポストをご確認のうえ、また明日お試しください。</p>
    </div>` + againLink(), "条件が確認できませんでした");
  }
  return show(`<div class="result">
    <div class="big mincho">ざんねん、ハズレです</div>
    <p class="sub">またのご参加をお待ちしています。<br>応募は1日1回、毎日できます。</p>
    <p class="sub" style="font-size:.84rem">※フォロー・リポストがお済みでない場合は、条件を満たしていないため当選の対象外です。念のためご確認ください。</p>
    ${THEME.legacy ? `<p class="sub" style="font-size:.84rem">ご購入いただいた方には、未発表の緑EDITION（テストプレイ中）をお渡ししています。@7shadesofseven までDMでお知らせください。</p>` : ""}
  </div>` + againLink(), "ざんねん");
}

const againLink = () =>
  `<p style="text-align:center;margin-top:1.6rem"><a href="/?c=${esc(SLUG)}" style="color:var(--accent-deep);font-size:.9rem">応募ページへ戻る</a></p>`;

// ------------------------------------------------ 応募画面
async function showEntry() {
  let c = null;
  try {
    // v=1 は「応募ページが開かれた」という印。これが無い呼び出し（状態確認など）は数えない
    const res = await fetch(FN + "/campaign?c=" + encodeURIComponent(SLUG) + "&v=1");
    c = await res.json();
  } catch (e) { /* 下で扱う */ }
  if (!c || !c.ok) return show(`<div class="msg">キャンペーンが見つかりませんでした。</div>`, "見つかりません");

  const { legacy, th } = applyTheme(c);
  const logoHtml = legacy
    ? `<div class="logobox"><img src="img/logo.webp" width="600" height="400" alt="7 SHADES OF S:EVEN"></div>`
    : (th.logoUrl ? `<div class="logobox"><img src="${esc(th.logoUrl)}" alt=""></div>` : "");
  const kvHtml = legacy
    ? `<img class="kv" src="img/keyvisual.webp" width="900" height="900" alt="ユドナリウムコネクト版の盤面" loading="lazy">`
    : (th.kvUrl ? `<img class="kv" src="${esc(th.kvUrl)}" alt="" loading="lazy">` : "");
  const claimUntilTxt = legacy ? "2026年9月30日（水）" : ymdw(th.claimUntil);
  const offerHtml = legacy ? `
    <div class="offer">
      <b>🎁 ご購入済みの方へ</b>
      <p>ユドナリウムコネクト版をご購入いただいた方には、未発表の<b style="display:inline">緑EDITION</b>（テストプレイ中）をお渡しします。キャンペーン期間中にご購入いただく方も対象です。</p>
      <p><a href="https://x.com/7shadesofseven" target="_blank" rel="noopener">@7shadesofseven</a> までDMでお知らせください。</p>
      <p class="fine">テストプレイ中のため、内容は変更される場合があります。お申し出は2026年9月24日（木）まで。</p>
    </div>`
    : ((th.offerTitle || th.offerBody) ? `
    <div class="offer">
      ${th.offerTitle ? `<b>${esc(th.offerTitle)}</b>` : ""}
      ${th.offerBody ? `<p class="body">${esc(th.offerBody)}</p>` : ""}
    </div>` : "");

  const err = qs.get("e");
  const closed = c.state !== "open";
  // 開始前は「いつから」まで出す。告知を先に出す運用なので、
  // 「まもなく」だけだと、いつ来ればいいのか分からないまま帰ってしまう
  let startTxt = "";
  try {
    startTxt = new Date(c.startsAt).toLocaleString("ja-JP",
      { timeZone: "Asia/Tokyo", month: "long", day: "numeric", hour: "2-digit", minute: "2-digit" });
  } catch (e) { /* 出せなければ従来の文言のまま */ }
  const notStartedYet = !!startTxt && !!c.startsAt && Date.now() < Date.parse(c.startsAt);
  const closedMsg =
      c.state === "after" ? "このキャンペーンは終了しました。"
    : notStartedYet ? startTxt + " から受け付けます。"
    : c.state === "before" ? "まもなく開始します。"
    : "現在受け付けていません。";

  show(`
    ${logoHtml}
    <p class="eyebrow">PRESENT CAMPAIGN</p>
    <h1 class="mincho">${esc(c.title)}</h1>
    <p class="lead">フォローとリポストで、その場で当たります。</p>

    ${err ? `<div class="msg">${esc(ERRORS[err] || "うまくいきませんでした。")}</div>` : ""}
    ${closed ? `<div class="msg">${closedMsg}</div>` : ""}

    ${c.state === "after" ? `
    <div class="offer">
      <b>🎉 当選された方へ</b>
      <p>受け取りリンクを、もう一度表示できます。当選したXアカウントでログインしてください。</p>
      <button class="go" id="claim">Xでログインして受け取りリンクを表示</button>
      <p class="fine">${claimUntilTxt}まで。当選した方ご本人にだけ表示されます。</p>
    </div>` : ""}

    <div class="card">
      <h2>賞品</h2>
      ${kvHtml}
      <p class="prize">${esc(c.prizeName)}</p>
      ${c.prizeNote ? `<p class="note">${esc(c.prizeNote)}</p>` : ""}
      <p class="note">1日${c.winsPerDay}名様</p>
    </div>

    <div class="card">
      <h2>応募のしかた</h2>
      <ol class="cond">
        <li>Xで主催アカウントをフォロー</li>
        <li>対象の投稿をリポスト</li>
        <li>下のボタンを押して、その場で結果を確認</li>
      </ol>
    </div>

    ${offerHtml}

    ${(c.publishWinners && c.state !== "after") ? `
    <label class="agree">
      <input type="checkbox" id="agree">
      <span>当選した場合、Xのユーザー名が発表投稿で公開されることに同意します。
      個人情報の取り扱いは<a href="https://www.asobuzz.net/%E8%A4%87%E8%A3%BD-%E3%82%B5%E3%82%A4%E3%83%88%E5%88%A9%E7%94%A8%E8%A6%8F%E7%B4%84" target="_blank" rel="noopener">プライバシーポリシー</a>をご確認ください。</span>
    </label>` : ""}

    ${c.state !== "after" ? `
    <button class="go" id="go" ${closed ? "disabled" : ""}>Xでログインして抽選する</button>
    <p class="note" style="text-align:center">Xの公式画面でログインします。このアプリは読み取りのみで、投稿やDMはできません。</p>` : ""}

    ${c.terms ? `<details><summary>応募要項を読む</summary><pre>${esc(c.terms)}</pre></details>` : ""}

    ${legacy ? `<div class="about">
      <b>⚙ このページについて</b>
      <p>フォローとリポストの確認から抽選・賞品のお渡しまで、すべて自動で行っています。外部のキャンペーンサービスは使っていません。</p>
      <p>同じ仕組みでキャンペーンを行いたい方は <a href="https://x.com/7shadesofseven" target="_blank" rel="noopener">@7shadesofseven</a> までお気軽にどうぞ。</p>
    </div>` : ""}
  `, c.title);

  const claimBtn = document.getElementById("claim");
  if (claimBtn) claimBtn.addEventListener("click", () => {
    claimBtn.disabled = true;
    claimBtn.textContent = "Xへ移動しています…";
    location.href = FN + "/start?c=" + encodeURIComponent(SLUG) + "&claim=1";
  });

  const go = document.getElementById("go");
  const agree = document.getElementById("agree");
  if (go) go.addEventListener("click", () => {
    if (agree && !agree.checked) {
      const box = document.querySelector(".agree");
      box.style.color = "var(--warn)";
      agree.focus();
      return;
    }
    go.disabled = true;
    go.textContent = "Xへ移動しています…";
    location.href = FN + "/start?c=" + encodeURIComponent(SLUG) + (agree ? "&agree=1" : "");
  });
}

const rid = qs.get("r");
if (rid) showResult(rid, qs.get("s") === "already");
else showEntry();
</script>
</body>
</html>
