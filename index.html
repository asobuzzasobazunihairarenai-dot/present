<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>準備中</title>
<style>
  :root{ --bg:#f7f6f3; --ink:#1b1a21; --muted:#75727f; --line:#e2dfdb; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14131a; --ink:#eae8f0; --muted:#918da1; --line:#2e2c3a; }
  }
  *{ box-sizing:border-box; margin:0; }
  body{
    background:var(--bg); color:var(--ink); min-height:100vh;
    display:grid; place-items:center; padding:2rem;
    font-family:"Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
    line-height:1.9;
  }
  .box{ text-align:center; max-width:26rem; }
  .bar{ display:flex; gap:3px; margin:0 auto 1.8rem; width:11rem; }
  .bar span{ height:5px; flex:1; border-radius:1px; }
  h1{ font-size:1.15rem; font-weight:700; letter-spacing:.04em; }
  p{ color:var(--muted); font-size:.86rem; margin-top:.7rem; }
  .rule{ border-top:1px solid var(--line); margin:1.8rem 0 0; padding-top:1rem; }
  .rule p{ font-size:.76rem; }
</style>
</head>
<body>
  <div class="box">
    <div class="bar">
      <span style="background:#c70025"></span><span style="background:#ee781f"></span>
      <span style="background:#fabe00"></span><span style="background:#22ac38"></span>
      <span style="background:#1bb8ce"></span><span style="background:#f19ec2"></span>
      <span style="background:#915da3"></span>
    </div>
    <h1>準備中です</h1>
    <p>このページはまだ公開されていません。</p>
    <div class="rule"><p>AsobuzZ</p></div>
  </div>
</body>
</html>
